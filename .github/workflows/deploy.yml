name: Deploy zu IONOS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Abhaengigkeiten installieren
        run: npm install

      - name: Website bauen
        run: npm run build
        env:
          NODE_ENV: production

      - name: Zu IONOS deployen (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/public/
          server-dir: /intellomind-ai/
          protocol: ftp
          port: 21
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Fehler-Benachrichtigung
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const commitShort = context.sha.slice(0, 7);
            await github.rest.issues.create({
              owner,
              repo,
              title: `Deployment fehlgeschlagen (${commitShort})`,
              body: `Der automatische Deploy zu IONOS ist fehlgeschlagen.\n\n[Logs ansehen](${runUrl})`,
            });
