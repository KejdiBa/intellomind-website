name: Deploy zu IONOS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Abhaengigkeiten installieren
        run: npm install

      - name: Website bauen
        run: npm run build
        env:
          NODE_ENV: production

      - name: lftp installieren
        run: sudo apt-get install -y lftp

      - name: Zu IONOS deployen (SFTP via lftp)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set sftp:auto-confirm yes;
            set net:timeout 30;
            set net:max-retries 3;
            open sftp://$FTP_USERNAME:$FTP_PASSWORD@$FTP_SERVER;
            rm -f fonts/inter-latin-800-normal.woff2;
            mirror --reverse --delete --verbose ./dist/public/ /;
            quit
          "

      - name: Fehler-Benachrichtigung
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const commitShort = context.sha.slice(0, 7);
            await github.rest.issues.create({
              owner,
              repo,
              title: `Deployment fehlgeschlagen (${commitShort})`,
              body: `Der automatische Deploy zu IONOS ist fehlgeschlagen.\n\n[Logs ansehen](${runUrl})`,
            });
